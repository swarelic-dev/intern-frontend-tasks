<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Record | SCAI</title>

  <style>
    /* TODO 1 completed: variables and base styles */
    :root {
      --bg: #f6f8fb;
      --surface: #ffffff;
      --border: #e3e8ef;
      --text: #1f2933;
      --text-muted: #667085;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #e8efff;
      --danger: #b42318;
      --danger-soft: #fdecec;
      --success: #146c2e;
      --success-bg: #e6f6ec;
      --radius: 10px;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.06),
        0 1px 3px rgba(16, 24, 40, 0.1);
      --font: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 16px;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    main {
      max-width: 480px;
      margin: 0 auto;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 24px;
    }

    /* TODO 2 completed: form card */
    form {
      padding: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .field {
      margin-bottom: 16px;
    }

    /* TODO 3 completed: field styles */
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      padding: 10px 12px;
      font: inherit;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    input:focus-visible,
    textarea:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--primary-soft);
      outline-offset: 2px;
    }

    /* TODO 4 completed: validation styles */
    input.invalid,
    textarea.invalid {
      border-color: var(--danger);
      background: var(--danger-soft);
    }

    .error {
      min-height: 20px;
      margin: 5px 0 0;
      color: var(--danger);
      font-size: 0.85rem;
    }

    .counter {
      margin: 5px 0 0;
      color: var(--text-muted);
      font-size: 0.85rem;
      text-align: right;
    }

    button[type="submit"] {
      width: 100%;
      min-height: 44px;
      padding: 10px 16px;
      cursor: pointer;
      color: #ffffff;
      background: var(--primary);
      border: 0;
      border-radius: 8px;
      font: inherit;
      font-weight: 600;
    }

    button[type="submit"]:hover {
      background: var(--primary-hover);
    }

    /* TODO 5 completed: success toast */
    #toast {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      max-width: calc(100% - 40px);
      padding: 12px 18px;
      color: var(--success);
      background: var(--success-bg);
      border: 1px solid var(--success);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      font-weight: 600;
      animation: toast-in 0.2s ease-out;
    }

    #toast[hidden] {
      display: none;
    }

    @keyframes toast-in {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .visually-hidden {
      position: absolute;
      left: -9999px;
    }

    @media (max-width: 520px) {
      body {
        padding: 20px 12px;
      }

      form {
        padding: 18px;
      }

      #toast {
        right: 12px;
        left: 12px;
        max-width: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #toast {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>New Record</h1>

    <form id="recordForm" novalidate>
      <!-- TODO 6 completed: form fields -->

      <div class="field">
        <label for="contactName">Contact Name</label>
        <input
          id="contactName"
          name="contactName"
          type="text"
          autocomplete="name"
          aria-describedby="contactName-error"
          aria-invalid="false"
        >
        <p
          class="error"
          id="contactName-error"
          role="alert"
        ></p>
      </div>

      <div class="field">
        <label for="phone">Phone Number</label>
        <input
          id="phone"
          name="phone"
          type="tel"
          autocomplete="tel"
          aria-describedby="phone-error"
          aria-invalid="false"
        >
        <p
          class="error"
          id="phone-error"
          role="alert"
        ></p>
      </div>

      <div class="field">
        <label for="apptDate">Appointment Date</label>
        <input
          id="apptDate"
          name="apptDate"
          type="date"
          aria-describedby="apptDate-error"
          aria-invalid="false"
        >
        <p
          class="error"
          id="apptDate-error"
          role="alert"
        ></p>
      </div>

      <div class="field">
        <label for="apptTime">Appointment Time</label>
        <input
          id="apptTime"
          name="apptTime"
          type="time"
          aria-describedby="apptTime-error"
          aria-invalid="false"
        >
        <p
          class="error"
          id="apptTime-error"
          role="alert"
        ></p>
      </div>

      <div class="field">
        <label for="notes">Notes</label>
        <textarea
          id="notes"
          name="notes"
          aria-describedby="notes-error notesCounter"
          aria-invalid="false"
        ></textarea>

        <p
          class="error"
          id="notes-error"
          role="alert"
        ></p>

        <p
          class="counter"
          id="notesCounter"
          aria-live="polite"
        >
          0 / 200
        </p>
      </div>

      <button type="submit">Save Record</button>
    </form>

    <div
      id="toast"
      role="status"
      aria-live="polite"
      hidden
    ></div>
  </main>

  <script src="validation.js" defer></script>
</body>
</html>
