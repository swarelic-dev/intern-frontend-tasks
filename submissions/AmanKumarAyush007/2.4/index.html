<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Directory | SCAI</title>

  <style>
    :root {
      --bg: #f6f8fb;
      --surface: #ffffff;
      --border: #e3e8ef;
      --text: #1f2933;
      --text-muted: #667085;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #e8efff;
      --danger-bg: #fdecec;
      --danger-text: #b42318;
      --radius: 10px;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.06),
        0 1px 3px rgba(16, 24, 40, 0.1);
      --font: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 16px;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 24px;
    }

    /* TODO 1 completed: responsive grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    /* TODO 2 completed: cards and avatars */
    .card {
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .avatar {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      margin-bottom: 14px;
      color: var(--primary);
      background: var(--primary-soft);
      border-radius: 50%;
      font-size: 1rem;
      font-weight: 700;
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 1.15rem;
    }

    .card p {
      margin: 8px 0;
      color: var(--text-muted);
      overflow-wrap: anywhere;
    }

    .card a {
      color: var(--primary);
    }

    .company {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 10px;
      color: var(--primary);
      background: var(--primary-soft);
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* TODO 3 completed: spinner */
    #loader {
      padding: 48px 20px;
      text-align: center;
      color: var(--text-muted);
    }

    .spinner {
      width: 36px;
      height: 36px;
      margin: 0 auto 12px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* TODO 4 completed: error state */
    #errorBox {
      padding: 20px;
      color: var(--danger-text);
      background: var(--danger-bg);
      border: 1px solid var(--danger-text);
      border-radius: var(--radius);
    }

    #errorBox p {
      margin-top: 0;
    }

    #retryBtn {
      min-height: 42px;
      padding: 9px 16px;
      cursor: pointer;
      color: #ffffff;
      background: var(--primary);
      border: 0;
      border-radius: 8px;
      font: inherit;
      font-weight: 600;
    }

    #retryBtn:hover {
      background: var(--primary-hover);
    }

    #retryBtn:focus-visible,
    .card a:focus-visible {
      outline: 3px solid var(--primary-soft);
      outline-offset: 2px;
    }

    /* TODO 5 completed */
    [hidden] {
      display: none !important;
    }

    @media (max-width: 640px) {
      body {
        padding: 20px 12px;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation-duration: 3s;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Team Directory</h1>

    <!-- Loading state -->
    <div id="loader" role="status">
      <div class="spinner" aria-hidden="true"></div>
      <p>Loading users...</p>
    </div>

    <!-- Error state -->
    <div id="errorBox" role="alert" hidden>
      <p id="errorMessage"></p>
      <button id="retryBtn" type="button">Retry</button>
    </div>

    <!-- Success state -->
    <section
      id="userGrid"
      class="grid"
      hidden
      aria-label="Users"
    ></section>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
