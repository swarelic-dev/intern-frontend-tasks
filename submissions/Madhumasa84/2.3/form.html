<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Record | SCAI</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --surface: #ffffff;
      --border: #cfd6e0;
      --text: #1f2933;
      --text-muted: #667085;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #b42318;
      --danger-border: #d92d20;
      --success: #146c2e;
      --success-bg: #e6f6ec;
      --radius: 10px;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.1);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px;
      background: var(--surface);
      border: 1px solid #e3e8ef;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    h1 { font-size: 1.5rem; margin: 0 0 16px; }

    .field { margin-bottom: 12px; }

    label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 0.9rem; }

    input, textarea {
      width: 100%;
      padding: 10px 12px;
      font: inherit;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    textarea { resize: vertical; min-height: 90px; }

    input:focus, textarea:focus {
      outline: 2px solid var(--primary);
      outline-offset: 1px;
      border-color: var(--primary);
    }

    .invalid, .invalid:focus { border-color: var(--danger-border); }
    .invalid:focus { outline-color: var(--danger-border); }

    .error {
      margin: 4px 0 0;
      min-height: 1.25rem;
      color: var(--danger);
      font-size: 0.85rem;
    }

    .counter { margin: 2px 0 0; text-align: right; font-size: 0.8rem; color: var(--text-muted); }

    button {
      width: 100%;
      margin-top: 8px;
      padding: 10px 16px;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: var(--primary);
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover { background: var(--primary-hover); }
    button:focus-visible { outline: 2px solid var(--primary-hover); outline-offset: 2px; }

    #toast {
      position: fixed;
      top: 16px;
      right: 16px;
      max-width: calc(100% - 32px);
      padding: 12px 20px;
      color: var(--success);
      background: var(--success-bg);
      border: 1px solid var(--success);
      border-radius: 8px;
      box-shadow: var(--shadow);
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #toast.show { opacity: 1; }

    [hidden] { display: none !important; }

    @media (max-width: 480px) {
      body { padding: 12px; }
      main { padding: 16px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>New Record</h1>

    <form id="recordForm" novalidate>
      <div class="field">
        <label for="contactName">Contact Name</label>
        <input id="contactName" name="contactName" type="text" autocomplete="name"
               aria-describedby="contactName-error">
        <p class="error" id="contactName-error" role="alert"></p>
      </div>

      <div class="field">
        <label for="phone">Phone Number</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="numeric"
               placeholder="10 digits" aria-describedby="phone-error">
        <p class="error" id="phone-error" role="alert"></p>
      </div>

      <div class="field">
        <label for="apptDate">Appointment Date</label>
        <input id="apptDate" name="apptDate" type="date" aria-describedby="apptDate-error">
        <p class="error" id="apptDate-error" role="alert"></p>
      </div>

      <div class="field">
        <label for="apptTime">Appointment Time</label>
        <input id="apptTime" name="apptTime" type="time" aria-describedby="apptTime-error">
        <p class="error" id="apptTime-error" role="alert"></p>
      </div>

      <div class="field">
        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" aria-describedby="notes-error notes-counter"></textarea>
        <p class="counter" id="notes-counter">0 / 200</p>
        <p class="error" id="notes-error" role="alert"></p>
      </div>

      <button type="submit">Save Record</button>
    </form>

    <div id="toast" role="status" aria-live="polite" hidden></div>
  </main>

  <script src="validation.js" defer></script>
</body>
</html>
