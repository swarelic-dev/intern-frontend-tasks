<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Directory | SCAI</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --surface: #ffffff;
      --border: #e3e8ef;
      --text: #1f2933;
      --text-muted: #667085;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #e8efff;
      --danger-bg: #fdecec;
      --danger-text: #b42318;
      --radius: 10px;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.1);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    main { max-width: 1080px; margin: 0 auto; }

    h1 { font-size: 1.5rem; margin: 0 0 16px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow-wrap: anywhere;
    }

    .avatar {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      margin-bottom: 4px;
      border-radius: 50%;
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 700;
    }

    .card h2 { margin: 0; font-size: 1.1rem; }

    .card a { color: var(--primary); text-decoration: none; }
    .card a:hover { text-decoration: underline; }

    .company {
      align-self: flex-start;
      margin-top: 6px;
      padding: 2px 10px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary-hover);
      font-size: 0.85rem;
      font-weight: 600;
    }

    #loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 48px 0;
      color: var(--text-muted);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #errorBox {
      padding: 20px;
      background: var(--danger-bg);
      color: var(--danger-text);
      border: 1px solid var(--danger-text);
      border-radius: var(--radius);
    }

    #errorBox p { margin: 0 0 12px; font-weight: 600; }

    #retryBtn {
      padding: 8px 16px;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: var(--primary);
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    #retryBtn:hover { background: var(--primary-hover); }

    [hidden] { display: none !important; }

    @media (max-width: 480px) {
      body { padding: 12px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Team Directory</h1>

    <!-- Loading state -->
    <div id="loader" role="status">
      <div class="spinner"></div>
      <p>Loading users...</p>
    </div>

    <!-- Error state -->
    <div id="errorBox" role="alert" hidden>
      <p id="errorMessage"></p>
      <button id="retryBtn" type="button">Retry</button>
    </div>

    <!-- Success state -->
    <section id="userGrid" class="grid" hidden aria-label="Users"></section>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
