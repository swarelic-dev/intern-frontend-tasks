<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Record | SCAI</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --surface: #ffffff;
      --border: #e3e8ef;
      --text: #1f2933;
      --text-muted: #667085;
      --primary: #2563eb;
      --danger: #b42318;
      --danger-bg: #fdecec;
      --success-bg: #e6f6ec;
      --success-text: #146c2e;
      --radius: 10px;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.1);
      --font: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    h1 {
      font-size: 1.5rem;
      margin: 0 0 16px;
    }

    form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 4px;
    }

    input, textarea {
      width: 100%;
      font: inherit;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      min-height: 40px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    input:focus, textarea:focus, button:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .invalid {
      border-color: var(--danger);
      background: #fff8f8;
    }

    .error {
      color: var(--danger);
      font-size: 0.85rem;
      min-height: 1.2em;
      margin: 4px 0 0;
    }

    .counter {
      display: block;
      text-align: right;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    button[type="submit"] {
      width: 100%;
      min-height: 42px;
      margin-top: 8px;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button[type="submit"]:hover {
      background: #1d4ed8;
    }

    #toast {
      position: fixed;
      top: 16px;
      right: 16px;
      background: var(--success-bg);
      color: var(--success-text);
      border: 1px solid #b7e4c7;
      padding: 12px 16px;
      border-radius: 8px;
      box-shadow: var(--shadow);
      max-width: 280px;
    }

    .visually-hidden {
      position: absolute;
      left: -9999px;
    }
  </style>
</head>
<body>
  <main>
    <h1>New Record</h1>

    <form id="recordForm" novalidate>
      <div class="field">
        <label for="contactName">Contact Name</label>
        <input id="contactName" name="contactName" type="text" autocomplete="name"
               aria-describedby="contactName-error">
        <p class="error" id="contactName-error" role="alert"></p>
      </div>

      <div class="field">
        <label for="phone">Phone Number</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel"
               aria-describedby="phone-error" placeholder="98765 43210">
        <p class="error" id="phone-error" role="alert"></p>
      </div>

      <div class="field">
        <label for="apptDate">Appointment Date</label>
        <input id="apptDate" name="apptDate" type="date" aria-describedby="apptDate-error">
        <p class="error" id="apptDate-error" role="alert"></p>
      </div>

      <div class="field">
        <label for="apptTime">Appointment Time</label>
        <input id="apptTime" name="apptTime" type="time" aria-describedby="apptTime-error">
        <p class="error" id="apptTime-error" role="alert"></p>
      </div>

      <div class="field">
        <label for="notes">Notes <span class="visually-hidden">(optional)</span></label>
        <textarea id="notes" name="notes" aria-describedby="notes-error notesCounter"></textarea>
        <span class="counter" id="notesCounter">0 / 200</span>
        <p class="error" id="notes-error" role="alert"></p>
      </div>

      <button type="submit">Save Record</button>
    </form>

    <div id="toast" role="status" aria-live="polite" hidden></div>
  </main>

  <script src="validation.js" defer></script>
</body>
</html>
