<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Directory | SCAI</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --surface: #ffffff;
      --border: #e3e8ef;
      --text: #1f2933;
      --text-muted: #667085;
      --primary: #2563eb;
      --error-bg: #fdecec;
      --error-text: #b42318;
      --space-4: 16px;
      --radius: 10px;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.1);
      --font: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body { font-family: var(--font); background: var(--bg); color: var(--text); margin: 24px auto; max-width: 1000px; line-height: 1.5; }

    h1 { margin-top: 0; margin-bottom: 24px; }

    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
      gap: 24px; 
    }
    
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 16px;
    }

    .name {
      font-size: 1.125rem;
      font-weight: 600;
      margin: 0 0 4px 0;
    }

    .company {
      font-size: 0.75rem;
      background: #e8efff;
      color: var(--primary);
      padding: 2px 8px;
      border-radius: 999px;
      margin-bottom: 12px;
      font-weight: 500;
    }

    .contact {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.875rem;
    }

    .contact a {
      color: var(--text-muted);
      text-decoration: none;
    }
    .contact a:hover {
      text-decoration: underline;
      color: var(--primary);
    }

    #loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px;
      color: var(--text-muted);
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #errorBox {
      background: var(--error-bg);
      color: var(--error-text);
      padding: 16px;
      border-radius: var(--radius);
      text-align: center;
      border: 1px solid #fca5a5;
    }

    #retryBtn {
      margin-top: 12px;
      padding: 8px 16px;
      background: #fff;
      border: 1px solid var(--error-text);
      color: var(--error-text);
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }
    
    #retryBtn:hover {
      background: var(--error-bg);
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>Team Directory</h1>

    <!-- Loading state -->
    <div id="loader" role="status">
      <div class="spinner"></div>
      <p>Loading users...</p>
    </div>

    <!-- Error state -->
    <div id="errorBox" role="alert" hidden>
      <p id="errorMessage"></p>
      <button id="retryBtn" type="button">Retry</button>
    </div>

    <!-- Success state -->
    <section id="userGrid" class="grid" hidden aria-label="Users"></section>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
